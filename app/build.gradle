plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.lucasmoraes.magosupremo'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.lucasmoraes.magosupremo'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
